name: Documentation and skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install check dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-checks.txt
      - name: Check generated templates and MIT notice
        run: python -B scripts/build_skill_assets.py --check
      - name: Check local links, anchors, fences, and portable package
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -B scripts/check_docs.py
      - name: Test checkers against isolated fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -B -m unittest discover -s scripts/tests -v
